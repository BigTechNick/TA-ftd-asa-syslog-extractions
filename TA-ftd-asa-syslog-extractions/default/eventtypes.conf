# TA-ftd-asa-syslog-extractions - CIM fixes for the Cisco Security Cloud app (tested with 4.1.3)
#
# Cisco's eventtype searches and tags outrank this add-on, so they cannot be edited from here.
# Its over-broad eventtypes are switched off instead (disabled is a key Cisco does not set) and,
# where something still belongs in a data model, replaced by an ftdx_* eventtype.
# Without the Cisco Security Cloud app these stanzas do nothing.

# FTD syslog connection start / end (430002 / 430003): tagged certificate and ssl (every
# connection lands in Certificates) and, for connection end, session (every connection end lands
# in Network_Sessions). They stay in Network_Traffic through Cisco's cisco_ftd_syslog_network.
[cisco_syslog_ConnectionEvent_begin_connect]
disabled = 1

[cisco_syslog_ConnectionEvent_end_connect]
disabled = 1

# FTD syslog file events (430004) and eStreamer file events: tagged endpoint and filesystem,
# which puts firewall file transfers into the Endpoint data model (Filesystem).
[cisco_syslog_FileEvent]
disabled = 1

[cisco_estreamer_FileEvent]
disabled = 1

# eStreamer file events tagged malware / attack / alert when SHA_Disposition is Malware OR
# Unknown. Unknown means no cloud verdict, which is most file events.
[cisco_estreamer_FileEvent_malware]
disabled = 1

# Replacement: files with a Malware verdict, and file malware events (Cisco tags neither type).
[ftdx_estreamer_malware]
search = sourcetype=cisco:sfw:estreamer ((EventType=FileEvent SHA_Disposition=Malware) OR EventType=FileMalwareEvent)

# ASA / FTD syslog network sessions: includes 725003 and 725007 (SSL session resume and SSL
# session terminated), which carry no user and make up most of Network_Sessions.
[cisco_asa_network_sessions]
disabled = 1

# Replacement: the same message IDs without 725003 and 725007.
[ftdx_asa_network_sessions]
search = (sourcetype="cisco:asa") (message_id="609001" OR message_id="609002" OR message_id="716058" OR message_id="716059" OR message_id="722028" OR message_id="722029" OR message_id="722030" OR message_id="722031" OR message_id="722037" OR message_id="751025")
