# TA-ftd-asa-syslog-extractions

# Cisco Secure Firewall action values -> CIM action (allowed / blocked / teardown).
# Access control rule actions, intrusion InlineResult values, file actions and the eStreamer
# blocked flag, matched without regard to case. CIM action values (allowed, blocked, success,
# failure, created ...) pass through unchanged. A value that is not listed leaves action empty.
# The file name changes whenever the table changes: Splunk Cloud keeps an app's existing lookup
# files on upgrade, so an edited table under the old name would never reach it.
[ftdx_cim_action_lookup]
filename = ftdx_cim_action_v2.csv
case_sensitive_match = false
max_matches = 1
