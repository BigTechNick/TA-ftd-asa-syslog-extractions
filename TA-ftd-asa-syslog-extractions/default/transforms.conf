# TA-ftd-asa-syslog-extractions

# Cisco Secure Firewall action values -> CIM action (allowed / blocked / teardown).
# Access control rule actions, intrusion InlineResult values and file actions, matched without
# regard to case. Values that are already CIM pass through unchanged.
[ftdx_cim_action_lookup]
filename = ftdx_cim_action.csv
case_sensitive_match = false
max_matches = 1
