# TA-ftd-asa-syslog-extractions
# Search-time field extractions for Cisco Secure Firewall Threat Defense (FTD) and
# ASA syslog message IDs, sourcetype cisco:asa, that neither the Splunk Add-on for
# Cisco ASA nor the Cisco Security Cloud app extracts. Install it alongside one of
# them: it adds fields, it does not replace their parsing or CIM mappings.
#
# Every regex accepts both %FTD- and %ASA- prefixes and is anchored on its own
# message ID, so it runs only on that message. Class names are unique
# (EXTRACT-ftdx_<msgid>), so they add to the add-ons' extractions instead of
# replacing them.
#
# Message IDs deliberately NOT covered here (an add-on already has a rule):
#   111008 113009 302010 711004 713049 713120 733100 734001
#   737003 737006 737016 737026 737034 746014 746015 746016 751025 751026 771002
# Message IDs with nothing worth extracting: 752011, 880002
# Examples in the comments use placeholders such as {src_ip} instead of real addresses.

[cisco:asa]
# 106010 - Deny inbound protocol 103 src inside:{src_ip} dst identity:{dest_ip}
EXTRACT-ftdx_106010 = %(?:FTD|ASA)-\d-106010:\s+(?<vendor_action>Deny)\s+(?<direction>inbound|outbound)\s+(?:protocol\s+(?<protocol_number>\d+)|(?<transport>\S+))\s+src\s+(?<src_interface>[^:\s]+):(?<src_ip>[^/\s(]+)(?:/(?<src_port>\d+))?(?:\s*\([^)]*\))?\s+dst\s+(?<dest_interface>[^:\s]+):(?<dest_ip>[^/\s(]+)(?:/(?<dest_port>\d+))?

# 106021 - Deny ICMP reverse path check from {src_ip} to {dest_ip} on interface {interface}
# (the add-ons' 106020_106021 rule does not match FTD's wording)
EXTRACT-ftdx_106021 = %(?:FTD|ASA)-\d-106021:\s+(?<vendor_action>\w+)\s+(?<transport>\S+)\s+reverse path check from\s+(?<src_ip>\S+)\s+to\s+(?<dest_ip>\S+)\s+on interface\s+(?<src_interface>\S+)

# 106102 - access-list X permitted tcp for user 'u' IFACE/{src_ip}(1234) -> IFACE/{dest_ip}(587) hit-cnt 1 ...
# user is left unset when FTD logs '<unknown>'
EXTRACT-ftdx_106102 = %(?:FTD|ASA)-\d-106102:\s+access-list\s+(?<rule>\S+)\s+(?<vendor_action>permitted|denied)\s+(?<transport>\S+)\s+for user\s+'(?:<unknown>|(?<user>[^']*))'\s+(?<src_interface>[^/\s]+)/(?<src_ip>[^(\s]+)\((?<src_port>\d+)\)\s+->\s+(?<dest_interface>[^/\s]+)/(?<dest_ip>[^(\s]+)\((?<dest_port>\d+)\)(?:\s+hit-cnt\s+(?<hit_count>\d+))?

# 109201 / 109207 / 109210 - UAUTH: Session=0x..., User=u, Assigned IP={assigned_ip}, Succeeded adding entry.
EXTRACT-ftdx_1092xx = %(?:FTD|ASA)-\d-1092\d\d:\s+UAUTH:\s+Session=(?<session_id>[^,\s]+),\s+User=(?<user>[^,]+),\s+Assigned IP=(?<assigned_ip>[^,\s]+),\s+(?<uauth_result>[^.]+)

# 199016 / 199017 / 199018 - Linux and chassis (FXOS) syslog passed through by FTD: process name
# (kernel, sshd, sudo, FPRM, ...) on every message
EXTRACT-ftdx_19901x_process = %(?:FTD|ASA)-\d-19901[678]:\s+(?<process_name>[\w.\-/]+)(?:\[(?<process_id>\d+)\])?:\s

# 199016 / 199018 - FPRM: <<%FPRM-4-LINK_DOWN>> [F1150][cleared][link-down][...] ...
EXTRACT-ftdx_19901x_fprm = %(?:FTD|ASA)-\d-19901[68]:\s+FPRM:\s+<<%FPRM-(?<fprm_severity>\d)-(?<fprm_event>[A-Z0-9_]+)>>

# 199018 - FPRM audit: [type][user][action][cause][id][dn][dn][] <text>
EXTRACT-ftdx_199018_audit = %(?:FTD|ASA)-\d-199018:\s+FPRM:\s+<<%FPRM-\d-AUDIT>>\s+\[(?<fprm_audit_type>[^\]]*)\]\[(?<fprm_audit_user>[^\]]*)\]\[(?<fprm_audit_action>[^\]]*)\]\[(?<fprm_audit_cause>[^\]]*)\]\[(?<fprm_audit_id>\d*)\]

# 199018 - ... local user admin logged in from {src_ip}
EXTRACT-ftdx_199018_login = %(?:FTD|ASA)-\d-199018:.*?\blocal user\s+(?<user>\S+)\s+logged in from\s+(?<src_ip>[0-9A-Fa-f:.]+)

# 199018 - ... cmd: connect ftd , logged in from {src_ip} on term /dev/pts/0: Local mgmt command executed
EXTRACT-ftdx_199018_cmd = %(?:FTD|ASA)-\d-199018:.*?\bcmd:\s+(?<command>.+?)\s*,\s+logged in from\s+(?<src_ip>[0-9A-Fa-f:.]+)

# 199018 - ... system terminated session id pts_0_1_1 of user admin due to idle timeout
EXTRACT-ftdx_199018_logout = %(?:FTD|ASA)-\d-199018:.*?\bterminated session id\s+(?<session_id>\S+)\s+of user\s+(?<user>\S+)\s+due to\s+(?<reason>.+?)(?:#012)*\s*$

# 199017 - sudo: root : TTY=console ; PWD=/ ; USER=root ; COMMAND=/usr/local/sf/bin/pmtool status
# (#012 is rsyslog's escape for a trailing newline)
EXTRACT-ftdx_199017_sudo = %(?:FTD|ASA)-\d-199017:\s+sudo:\s+(?<src_user>\S+)\s+:\s+(?:TTY=(?<tty>[^;]+?)\s+;\s+)?(?:PWD=(?<pwd>[^;]+?)\s+;\s+)?USER=(?<user>[^;\s]+)\s+;\s+COMMAND=(?<command>.+?)(?:#012)*\s*$

# 210005 - LU allocate connection failed for TCP connection from INSIDE:{src_ip}/51392 to Outside:{dest_ip}/443
EXTRACT-ftdx_210005 = %(?:FTD|ASA)-\d-210005:\s+LU allocate\s+(?<lu_object>\S+)\s+failed for\s+(?<transport>\S+)\s+connection from\s+(?<src_interface>[^:\s]+):(?<src_ip>[^/\s]+)/(?<src_port>\d+)\s+to\s+(?<dest_interface>[^:\s]+):(?<dest_ip>[^/\s]+)/(?<dest_port>\d+)

# 302017 - Built inbound GRE connection N from IFACE:foreign (xlate) to IFACE:local/callid (xlate)
EXTRACT-ftdx_302017_inbound = %(?:FTD|ASA)-\d-302017:\s+(?<vendor_action>Built)\s+(?<direction>inbound)\s+(?<transport>GRE)\s+connection\s+(?<connection_id>\d+)\s+from\s+(?<src_interface>[^:\s]+):(?<src_ip>[^/\s(]+)(?:/\d+)?\s+\((?<src_translated_ip>[^/)\s]+)(?:/\d+)?\)\s+to\s+(?<dest_interface>[^:\s]+):(?<dest_ip>[^/\s(]+)/(?<gre_call_id>\d+)\s+\((?<dest_translated_ip>[^/)\s]+)

# 302017 - Built outbound GRE: the "from" side is the foreign (destination) host
EXTRACT-ftdx_302017_outbound = %(?:FTD|ASA)-\d-302017:\s+(?<vendor_action>Built)\s+(?<direction>outbound)\s+(?<transport>GRE)\s+connection\s+(?<connection_id>\d+)\s+from\s+(?<dest_interface>[^:\s]+):(?<dest_ip>[^/\s(]+)(?:/\d+)?\s+\((?<dest_translated_ip>[^/)\s]+)(?:/\d+)?\)\s+to\s+(?<src_interface>[^:\s]+):(?<src_ip>[^/\s(]+)/(?<gre_call_id>\d+)\s+\((?<src_translated_ip>[^/)\s]+)

# 302018 - Teardown GRE connection N from IFACE:ip to IFACE:ip/callid duration 0:02:01 bytes 0
EXTRACT-ftdx_302018 = %(?:FTD|ASA)-\d-302018:\s+(?<vendor_action>Teardown)\s+(?<transport>GRE)\s+connection\s+(?<connection_id>\d+)\s+from\s+(?<src_interface>[^:\s]+):(?<src_ip>[^/\s(]+)(?:/\d+)?\s+to\s+(?<dest_interface>[^:\s]+):(?<dest_ip>[^/\s(]+)/(?<gre_call_id>\d+)\s+duration\s+(?<duration>\S+)\s+bytes\s+(?<bytes>\d+)

# 305006 - regular translation creation failed for icmp src GUEST:{src_ip} dst Outside:{dest_ip} (type 3, code 3)
EXTRACT-ftdx_305006 = %(?:FTD|ASA)-\d-305006:\s+(?<nat_type>.+?)\s+translation creation failed for\s+(?<transport>\S+)\s+src\s+(?<src_interface>[^:\s]+):(?<src_ip>[^/\s]+)(?:/(?<src_port>\d+))?(?:\s+\([^)]*\))?\s+dst\s+(?<dest_interface>[^:\s]+):(?<dest_ip>[^/\s]+)(?:/(?<dest_port>\d+))?(?:\s+\(type\s+(?<icmp_type>\d+),\s+code\s+(?<icmp_code>\d+)\))?

# 313008 - Denied IPv6-ICMP type=130, code=0 from {src_ip} on interface {interface}
EXTRACT-ftdx_313008 = %(?:FTD|ASA)-\d-313008:\s+(?<vendor_action>Denied)\s+(?<transport>\S+)\s+type=(?<icmp_type>\d+),\s+code=(?<icmp_code>\d+)\s+from\s+(?<src_ip>\S+)\s+on interface\s+(?<src_interface>\S+)

# 317077 / 317078 - Added STATIC route {route_network} {route_mask} via {route_next_hop} [1/0] on [VPN-Outside] ...
EXTRACT-ftdx_31707x = %(?:FTD|ASA)-\d-31707[78]:\s+(?<route_action>Added|Deleted)\s+(?<route_type>\S+)\s+route\s+(?<route_network>\S+)\s+(?<route_mask>\S+)\s+via\s+(?<route_next_hop>\S+)\s+\[(?<route_distance>\d+)/(?<route_metric>\d+)\]\s+on\s+\[(?<route_interface>[^\]]+)\]

# 410001 - Dropped UDP DNS request from IFACE:ip/port to IFACE:ip/53; label length 105 bytes exceeds ...
EXTRACT-ftdx_410001 = %(?:FTD|ASA)-\d-410001:\s+(?<vendor_action>Dropped)\s+(?<transport>\S+)\s+DNS\s+(?<dns_message_type>\w+)\s+from\s+(?<src_interface>[^:\s]+):(?<src_ip>[^/\s]+)/(?<src_port>\d+)\s+to\s+(?<dest_interface>[^:\s]+):(?<dest_ip>[^/\s]+)/(?<dest_port>\d+);\s*(?<reason>.+)

# 508002 - DCERPC response has low endpoint port 900 from IFACE:ip/135 to IFACE:ip/58115, terminating connection.
EXTRACT-ftdx_508002 = %(?:FTD|ASA)-\d-508002:\s+DCERPC response has low endpoint port\s+(?<dcerpc_endpoint_port>\d+)\s+from\s+(?<src_interface>[^:\s]+):(?<src_ip>[^/\s]+)/(?<src_port>\d+)\s+to\s+(?<dest_interface>[^:\s]+):(?<dest_ip>[^/\s,]+)/(?<dest_port>\d+)

# 607002 - SIP Parameter: Received SIP Response 200 from IFACE:ip/5060 to IFACE:ip/49231; Found Other Media
EXTRACT-ftdx_607002 = %(?:FTD|ASA)-\d-607002:\s+(?<sip_action_class>[^:]+):\s+(?<sip_action>\w+)\s+SIP\s+(?<sip_type>Request|Response)\s+(?<sip_code>\S+)\s+from\s+(?<src_interface>[^:\s]+):(?<src_ip>[^/\s]+)/(?<src_port>\d+)\s+to\s+(?<dest_interface>[^:\s]+):(?<dest_ip>[^/\s]+)/(?<dest_port>\d+)(?:;\s*(?<sip_detail>.+))?

# 721016 / 721018 - (WebVPN-Secondary) WebVPN session for client user u, IPv4 {src_ip} has been created|deleted.
EXTRACT-ftdx_7210xx = %(?:FTD|ASA)-\d-72101[68]:\s+\((?<webvpn_role>[^)]+)\)\s+WebVPN session for client user\s+(?<user>[^,]+),\s+IP(?:v[46])?\s+(?<src_ip>\S+)\s+has been\s+(?<session_action>\w+)

# 722035 - Group <G> User <u> IP <{src_ip}> Received large packet 1550 (threshold 1390).
EXTRACT-ftdx_722035 = %(?:FTD|ASA)-\d-722035:\s+Group\s+<(?<group>[^>]*)>\s+User\s+<(?<user>[^>]*)>\s+IP\s+<(?<src_ip>[^>]*)>\s+Received large packet\s+(?<packet_size>\d+)\s+\(threshold\s+(?<packet_threshold>\d+)\)

# 750xxx / 751xxx IKEv2 - Local:ip:port Remote:ip:port Username:x IKEv2 <message>[. Reason: <reason>]
# Remote peer -> src, firewall (Local) -> dest. Skips 751025/751026, which the add-ons cover.
# Username goes to ike_username (often the peer IP or "Unknown"), not user.
EXTRACT-ftdx_75xxxx_ikev2 = %(?:FTD|ASA)-\d-(?!75102[56])75[01]\d{3}:\s+Local:(?<dest_ip>\S+):(?<dest_port>\d+)\s+Remote:(?<src_ip>\S+):(?<src_port>\d+)\s+Username:(?<ike_username>\S+)\s+IKEv2\s+(?<ike_message>.+?)(?:\.\s+Reason:\s*(?<reason>.+?))?\s*$

# 752xxx - Tunnel Manager / IKEv2 tunnel setup: Map Tag = X. Map Sequence Number = N.
EXTRACT-ftdx_752xxx = %(?:FTD|ASA)-\d-752\d{3}:.*?Map Tag\s*=\s*(?<crypto_map>\S+?)\.\s+Map Sequence Number\s*=\s*(?<crypto_map_seq>\d+)

# ---------------------------------------------------------------- failover and interfaces

# 104001 / 104002 / 104004 - (Primary) Switching to ACTIVE - Other unit wants me Active. Secondary unit switch reason: Interface check.
EXTRACT-ftdx_10400x = %(?:FTD|ASA)-\d-10400[1-4]:\s+\((?<failover_unit>Primary|Secondary)\)\s+Switching to\s+(?<failover_state>[A-Za-z]+)(?:\s+-\s+(?<reason>.*?))?\.?(?:#012)*\.?\s*$

# 105003 / 105004 - (Primary) Monitoring on interface {interface} waiting|normal
EXTRACT-ftdx_10500x_monitor = %(?:FTD|ASA)-\d-10500[34]:\s+\((?<failover_unit>Primary|Secondary)\)\s+Monitoring on interface\s+(?<interface>\S+)\s+(?<monitor_status>\w+)

# 105006 / 105007 - (Primary) Link status 'Up' on interface {interface}
EXTRACT-ftdx_10500x_link = %(?:FTD|ASA)-\d-10500[67]:\s+\((?<failover_unit>Primary|Secondary)\)\s+Link status\s+'(?<link_status>[^']+)'\s+on interface\s+(?<interface>\S+)

# 411001 / 411002 - Line protocol on Interface Ethernet2/2, changed state to up|down
EXTRACT-ftdx_41100x = %(?:FTD|ASA)-\d-41100[1-4]:\s+Line protocol on Interface\s+(?<interface>[^,]+),\s+changed state to\s+(?<interface_status>\w+)

# 720027 / 720028 - (VPN-Primary) HA status callback: My state Active. | Peer state Standby Ready.
EXTRACT-ftdx_72002x = %(?:FTD|ASA)-\d-72002[78]:\s+\((?<ha_component>VPN)-(?<failover_unit>Primary|Secondary)\)\s+HA status callback:\s+(?:My state\s+(?<ha_my_state>[^.]+)|Peer state\s+(?<ha_peer_state>[^.]+))

# 720032 / 720037 - (VPN-Primary) HA status|progression callback: id=3,seq=200,grp=0,event=406,op=80,my=Active,peer=Standby Ready.
EXTRACT-ftdx_72003x = %(?:FTD|ASA)-\d-7200(?:32|37):\s+\((?<ha_component>VPN)-(?<failover_unit>Primary|Secondary)\)\s+HA\s+\w+\s+callback:\s+id=(?<ha_id>\d+),seq=(?<ha_seq>\d+),grp=(?<ha_group>\d+),event=(?<ha_event>\d+),op=(?<ha_op>\d+),my=(?<ha_my_state>[^,]+),peer=(?<ha_peer_state>[^.]+)

# 720039 / 720040 - (VPN-Primary) VPN failover client is transitioning to active|standby state
EXTRACT-ftdx_72003940 = %(?:FTD|ASA)-\d-7200(?:39|40):\s+\((?<ha_component>VPN)-(?<failover_unit>Primary|Secondary)\)\s+VPN failover client is transitioning to\s+(?<ha_my_state>\w+)\s+state

# 721002 / 721003 - (WebVPN-Primary) HA status|progression change: event HA_..., my state Active, peer state Standby Ready.
EXTRACT-ftdx_72100x = %(?:FTD|ASA)-\d-72100[23]:\s+\((?<ha_component>WebVPN)-(?<failover_unit>Primary|Secondary)\)\s+HA\s+\w+\s+change:\s+event\s+(?<ha_event>[^,]+),\s+my state\s+(?<ha_my_state>[^,]+),\s+peer state\s+(?<ha_peer_state>[^.]+)

# ---------------------------------------------------------------- NAT, fragments, tunnels

# 202010 - PAT pool exhausted in pool 'v4-0.0.0.0' IP 0.0.0.0, port range (1-65535). Unable to create UDP connection from IFACE:{src_ip}/5060 to IFACE:{dest_ip}/5060.
EXTRACT-ftdx_202010 = %(?:FTD|ASA)-\d-202010:\s+(?<reason>(?:PAT|NAT) pool exhausted)\s+in pool\s+'(?<nat_pool>[^']*)'\s+IP\s+(?<nat_pool_ip>\S+),\s+port range\s+\((?<nat_port_range>[^)]*)\)\.\s+Unable to create\s+(?<transport>\S+)\s+connection from\s+(?<src_interface>[^:\s]+):(?<src_ip>[^/\s]+)/(?<src_port>\d+)\s+to\s+(?<dest_interface>[^:\s]+):(?<dest_ip>[^/\s]+)/(?<dest_port>\d+)

# 209003 / 209005 - Fragment database limit of 200 exceeded: | Discard IP fragment set with more than 24 elements:  src = {src_ip}, dest = {dest_ip}, proto = UDP, id = 1
EXTRACT-ftdx_20900x = %(?:FTD|ASA)-\d-20900[35]:\s+(?<reason>Fragment database limit|Discard IP fragment set)\s+.*?(?<fragment_limit>\d+)\s+(?:exceeded|elements):\s+src\s+=\s+(?<src_ip>[^,\s]+),\s+dest\s+=\s+(?<dest_ip>[^,\s]+),\s+proto\s+=\s+(?<transport>[^,\s]+),\s+id\s+=\s+(?<fragment_id>\d+)

# 209006 - Fragment queue threshold exceeded, dropped UDP fragment from {src_ip}/0 to {dest_ip}/0 on {interface} interface.
EXTRACT-ftdx_209006 = %(?:FTD|ASA)-\d-209006:\s+Fragment queue threshold exceeded,\s+(?<vendor_action>dropped)\s+(?<transport>\S+)\s+fragment from\s+(?<src_ip>[^/\s]+)/(?<src_port>\d+)\s+to\s+(?<dest_ip>[^/\s]+)/(?<dest_port>\d+)\s+on\s+(?<src_interface>\S+)\s+interface

# 210007 - LU allocate xlate failed for dynamic-pat UDP translation from IFACE:{src_ip}/38708 ({src_translated_ip}/59376) to IFACE:{dest_ip}/53 ({dest_translated_ip}/53)
EXTRACT-ftdx_210007 = %(?:FTD|ASA)-\d-210007:\s+LU allocate xlate failed for\s+(?<nat_type>\S+)\s+(?<transport>\S+)\s+translation from\s+(?<src_interface>[^:\s]+):(?<src_ip>[^/\s]+)/(?<src_port>\d+)\s+\((?<src_translated_ip>[^/)\s]+)/(?<src_translated_port>\d+)\)\s+to\s+(?<dest_interface>[^:\s]+):(?<dest_ip>[^/\s]+)/(?<dest_port>\d+)\s+\((?<dest_translated_ip>[^/)\s]+)/(?<dest_translated_port>\d+)\)

# 210022 - LU missed 10049 updates
EXTRACT-ftdx_210022 = %(?:FTD|ASA)-\d-210022:\s+LU missed\s+(?<lu_missed_updates>\d+)\s+updates

# 302037 - Built inbound IPINIP connection N from IFACE:{src_ip}/0 to IFACE:{dest_ip}/0
EXTRACT-ftdx_302037_inbound = %(?:FTD|ASA)-\d-302037:\s+(?<vendor_action>Built)\s+(?<direction>inbound)\s+(?<transport>\S+)\s+connection\s+(?<connection_id>\d+)\s+from\s+(?<src_interface>[^:\s]+):(?<src_ip>[^/\s]+)/(?<src_port>\d+)\s+to\s+(?<dest_interface>[^:\s]+):(?<dest_ip>[^/\s]+)/(?<dest_port>\d+)

# 302037 - Built outbound: the "from" side is the foreign (destination) host
EXTRACT-ftdx_302037_outbound = %(?:FTD|ASA)-\d-302037:\s+(?<vendor_action>Built)\s+(?<direction>outbound)\s+(?<transport>\S+)\s+connection\s+(?<connection_id>\d+)\s+from\s+(?<dest_interface>[^:\s]+):(?<dest_ip>[^/\s]+)/(?<dest_port>\d+)\s+to\s+(?<src_interface>[^:\s]+):(?<src_ip>[^/\s]+)/(?<src_port>\d+)

# 302038 - Teardown IPINIP connection N for IFACE:{src_ip}/0 to IFACE:{dest_ip}/0 duration 0:02:01 bytes 0
EXTRACT-ftdx_302038 = %(?:FTD|ASA)-\d-302038:\s+(?<vendor_action>Teardown)\s+(?<transport>\S+)\s+connection\s+(?<connection_id>\d+)\s+for\s+(?<src_interface>[^:\s]+):(?<src_ip>[^/\s]+)/(?<src_port>\d+)\s+to\s+(?<dest_interface>[^:\s]+):(?<dest_ip>[^/\s]+)/(?<dest_port>\d+)\s+duration\s+(?<duration>\S+)\s+bytes\s+(?<bytes>\d+)

# 508001 - DCERPC unknown non-standard major version 36 from IFACE:{src_ip}/58490 to IFACE:{dest_ip}/135, terminating connection.
EXTRACT-ftdx_508001 = %(?:FTD|ASA)-\d-508001:\s+DCERPC\s+(?<reason>.+?)\s+(?<dcerpc_version>\d+)\s+from\s+(?<src_interface>[^:\s]+):(?<src_ip>[^/\s]+)/(?<src_port>\d+)\s+to\s+(?<dest_interface>[^:\s]+):(?<dest_ip>[^/\s,]+)/(?<dest_port>\d+)

# ---------------------------------------------------------------- IKE / IPsec, AnyConnect, SAML

# 713050 - Group = G, IP = {src_ip}, Connection terminated for peer {src_ip}.  Reason: IPSec SA Idle Timeout  Remote Proxy {ip}, Local Proxy {ip}
EXTRACT-ftdx_713050 = %(?:FTD|ASA)-\d-713050:\s+Group\s+=\s+(?<group>[^,]+),\s+IP\s+=\s+(?<src_ip>[^,]+),\s+Connection terminated for peer\s+\S+?\.\s+Reason:\s+(?<reason>.+?)\s+Remote Proxy\s+(?<remote_proxy>[^,]+),\s+Local Proxy\s+(?<local_proxy>\S+)

# 713257 - Phase 1 failure:  Mismatched attribute types for class Group Description:  Rcv'd: Group 1  Cfg'd: Group 14
EXTRACT-ftdx_713257 = %(?:FTD|ASA)-\d-713257:\s+Phase\s+(?<ike_phase>\d)\s+failure:\s+(?<reason>.+?):\s+Rcv'd:\s+(?<ike_received>.+?)\s+Cfg'd:\s+(?<ike_configured>.+?)\s*$

# 713259 - Group = G, IP = {src_ip}, Session is being torn down. Reason: Idle Timeout
EXTRACT-ftdx_713259 = %(?:FTD|ASA)-\d-713259:\s+Group\s+=\s+(?<group>[^,]+),\s+IP\s+=\s+(?<src_ip>[^,]+),\s+Session is being torn down\.\s+Reason:\s+(?<reason>.+?)\s*$

# 713904 - IP = {src_ip}, Received encrypted packet with no matching SA, dropping
EXTRACT-ftdx_713904 = %(?:FTD|ASA)-\d-713904:\s+(?:Group\s+=\s+(?<group>[^,]+),\s+)?IP\s+=\s+(?<src_ip>[^,]+),\s+(?<ike_message>.+?)\s*$

# 716164 - SAML response relay state missing data integrity hash. Client IP: {src_ip}
EXTRACT-ftdx_716164 = %(?:FTD|ASA)-\d-716164:\s+(?<reason>.+?)\.\s+Client IP:\s+(?<src_ip>\S+)

# 722013 - Group <G> User <u> IP <{src_ip}> SVC Message: 17/INFO: The VPN connection is being paused without restrictions..
EXTRACT-ftdx_722013 = %(?:FTD|ASA)-\d-722013:\s+Group\s+<(?<group>[^>]*)>\s+User\s+<(?<user>[^>]*)>\s+IP\s+<(?<src_ip>[^>]*)>\s+SVC Message:\s+(?<svc_message_id>\d+)/(?<svc_severity>\w+):\s+(?<svc_message>.+?)\.*\s*$

# ---------------------------------------------------------------- system

# 121003 - 14:08:17 CST Nov 4 2026: msgId 55. Telemetry request from the chassis received. SSE connector status: enabled. Telemetry config on the blade: enabled. ...
EXTRACT-ftdx_121003 = %(?:FTD|ASA)-\d-121003:.*?msgId\s+(?<telemetry_msg_id>\d+)\.\s+(?<telemetry_message>.+?)(?:\s+SSE connector status:\s+(?<sse_connector_status>\w+)\.)?(?:\s+Telemetry config on the blade:\s+(?<telemetry_blade_config>\w+)\.)?\s+(?<telemetry_result>[^.#]+?)(?:#012)*\s*$

# 199022 / 199024 - Backup operation started|finished at 08:03:11 UTC Wed Nov 4 2026 . Target location: disk0:/running_configuration_file
EXTRACT-ftdx_19902x = %(?:FTD|ASA)-\d-1990(?:22|24):\s+Backup operation\s+(?<backup_status>\w+)\s+at\s+(?<backup_time>.+?)\s+\.(?:\s+Target location:\s+(?<backup_target>\S+))?

# 447001 - ASP DP to CP Punt Event Queue was full. Queue length 2048, limit 2048
EXTRACT-ftdx_447001 = %(?:FTD|ASA)-\d-447001:\s+ASP DP to CP\s+(?<queue_name>.+?)\s+was full\.\s+Queue length\s+(?<queue_length>\d+),\s+limit\s+(?<queue_limit>\d+)

